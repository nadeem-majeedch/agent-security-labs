[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec"
version = "0.0.1"
description = "AI Agent Security Lab - educational, reproducible agent-security infrastructure (Phase A skeleton)."
readme = "docs/development.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Core runtime dependencies (Phase 14 dependency audit, Task 22).
# PyYAML is required by the policy YAML loader; httpx is only pulled in when a
# live provider adapter is used.
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
live = ["httpx>=0.27"]
# Documentation site (optional). Not required to run the labs or the tests.
docs = ["mkdocs-material>=9"]

[project.scripts]
agentsec = "agentsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
