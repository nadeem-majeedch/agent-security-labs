# Publish the MkDocs documentation site to GitHub Pages.
#
# This workflow only builds and publishes the existing educational material. It
# runs no tests (see ci.yml for those) and does not change the site structure.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions for the Pages deployment mechanism: read the repository,
# write the Pages artifact, and mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the MkDocs site (strict)
        run: python -m mkdocs build --strict

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
