# Continuous integration: run every release validation once, and report release
# readiness.
#
# Structure
# ---------
# 1. Two standard-library guards run **before** the install so a licence or
#    version drift fails fast, without waiting for (or needing) a network
#    install. They are cheap, read-only and deliberately pre-install.
# 2. The package is installed with its `dev` and `docs` extras. The `docs` extra
#    makes the MkDocs validation a real strict build rather than an unverified
#    warning.
# 3. `scripts/release_check.py --json` is the **single executor** of the
#    expensive validations. In one read-only pass it runs the test suite, the
#    lab self-check, the strict MkDocs build, the licensing and version guards,
#    the README link check, package self-containment, repository hygiene and the
#    Git-state check. It prints a PASS/WARN/FAIL line per gate plus a
#    machine-readable summary, and exits non-zero when any gate FAILs (a release
#    blocker), so the job fails on a broken test, lab, build or guard.
#
# Why there is no separate `pytest` or `agentsec labs check` step
# ---------------------------------------------------------------
# The aggregate gate already runs `python -m pytest -p no:cacheprovider` and
# `python -m agentsec labs check`. Running them again in separate steps executed
# the whole suite and the whole lab self-check twice. Here the gate is the only
# place they run, so each expensive validation runs **once** while its result
# stays visible: the gate reports `tests` and `labs` with their counts (for
# example `852 tests passed`, `8/8 labs passed`) and names any failing gate in
# its output. `python scripts/release_check.py --json` keeps its existing
# behaviour, including its exit code.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: tests and lab self-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the licence metadata and coverage
        run: python scripts/check_licensing.py

      - name: Check the declared version is consistent
        run: python scripts/check_version.py

      - name: Install the package (with dev and docs extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Run every release gate once and report readiness
        run: python scripts/release_check.py --json
