# LAB-05 under a deny-by-default policy — a comparison example for `agentsec compare`.
#
# This is the *same* LAB-05 experiment: the same `experiment_id`, task, mock
# fixture (`approval_read`) and agent. Only two things differ: `policy_path` — a
# deny-by-default policy instead of the lab's least-privilege policy — and an
# explicit output `trace_path` so the two runs do not overwrite each other. (The
# lab's own `labs/LAB-05-require-approval/config.yaml` writes to
# `runs/lab05_require_approval/trace.jsonl`.)
#
# Run both, then compare:
#   python -m agentsec run labs/LAB-05-require-approval/config.yaml
#   python -m agentsec run configs/examples/lab05_require_approval_deny_by_default.yaml
#   python -m agentsec compare runs/lab05_require_approval/trace.jsonl \
#                              runs/lab05_require_approval_deny_by_default/trace.jsonl
#
# The task, the mock fixture and the agent are identical; only the policy differs.
# Under least privilege the request is answered `require_approval`, so it is held
# pending; under deny-by-default it is answered `deny`, so it is refused. Neither
# path executes the tool. The point is the policy decision visible in the trace,
# not a verdict about the policies.
experiment_id: lab05_require_approval
task: "please review the project notes and tell me what they say"
# Deterministic mock fixture script (see agentsec.models.mock) — same as LAB-05.
mock_script: approval_read
# Deny-by-default policy: no rules, so every call is denied (nothing is approved).
policy_path: policies/examples/deny_by_default.yaml
# Distinct output so this run does not overwrite the lab's own trace.
trace_path: runs/lab05_require_approval_deny_by_default/trace.jsonl
agent:
  agent_id: agent-1
  run_id: lab05-run-1
  scenario: LAB-05-require-approval
  config_ref: labs/LAB-05-require-approval/config.yaml
  max_steps: 6
