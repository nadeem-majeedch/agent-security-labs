# LAB-01 - Observe a Benign Agent
#
# One benign run: the mock agent asks the sandboxed calculator for 2 + 3, the
# policy allows it, the tool executes, and the agent answers.
#
# `scenario.yaml` wraps this same experiment and declares the expected
# observations; a test asserts the two stay identical, so edit both together.
experiment_id: lab01_benign
task: "please add 2 and 3"
# Deterministic mock fixture script (see agentsec.models.mock).
mock_script: benign
# Least-privilege policy: calculator allowed, out-of-scope tool use denied.
policy_path: policies/examples/least_privilege_v1.yaml
agent:
  agent_id: agent-1
  run_id: lab01-run-1
  scenario: LAB-01-benign-agent
  config_ref: labs/LAB-01-benign-agent/config.yaml
  max_steps: 6
